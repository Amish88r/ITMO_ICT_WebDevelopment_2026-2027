  - "Задание 1. UDP": task1.md
  - "Задание 2. TCP-вычисления": task2.md
  - "Задание 3. HTML по HTTP": task3.md
  - "Задание 4. Чат": task4.md
  - "Задание 5. GET/POST": task5.md
  - Выводы: conclusion.md
