site_name: ЛР1. Работа с сокетами
site_description: Отчёт по лабораторной работе №1 по дисциплине «Веб-программирование»
theme:
  name: material
  language: ru
  features:
    - content.code.copy
    - navigation.instant
markdown_extensions:
