{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="card shadow-sm border-0 mx-auto" style="max-width:420px"><div class="card-body p-4">
<h3 class="text-center mb-3"><i class="bi bi-journal-check text-primary"></i> Вход</h3>
{% if form.errors %}<div class="alert alert-danger small">Неверный логин или пароль</div>{% endif %}
<form method="post">{% csrf_token %}
  <div class="mb-3"><label class="form-label">Логин</label><input name="username" class="form-control" autofocus required></div>
  <div class="mb-3"><label class="form-label">Пароль</label><input type="password" name="password" class="form-control" required></div>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn btn-primary w-100">Войти</button></form>
<p class="text-center small mt-3 mb-0">Нет аккаунта? <a href="{% url 'signup' %}">Регистрация</a></p></div></div>
{% endblock %}
