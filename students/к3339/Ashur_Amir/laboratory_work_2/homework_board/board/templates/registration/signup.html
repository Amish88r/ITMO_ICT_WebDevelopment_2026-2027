{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="card shadow-sm border-0 mx-auto" style="max-width:560px"><div class="card-body p-4">
<h3 class="text-center mb-3">Регистрация студента</h3>
<form method="post">{% csrf_token %}
{% for f in form %}<div class="mb-2"><label class="form-label">{{ f.label }}</label>{{ f }}
  {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
<button class="btn btn-primary w-100 mt-2">Зарегистрироваться</button></form>
<p class="text-center small mt-3 mb-0">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p></div></div>
{% endblock %}
