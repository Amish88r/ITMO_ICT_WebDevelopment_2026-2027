{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm border-0 mx-auto" style="max-width:520px"><div class="card-body text-center">
<i class="bi bi-exclamation-octagon text-danger fs-1"></i>
<h4 class="mt-2">Удалить «{{ object }}»?</h4><p class="text-muted">Действие нельзя отменить.</p>
<form method="post">{% csrf_token %}<button class="btn btn-danger">Да, удалить</button>
<a href="javascript:history.back()" class="btn btn-outline-secondary">Отмена</a></form></div></div>
{% endblock %}
